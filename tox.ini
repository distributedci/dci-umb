[tox]
skipsdist = True
envlist = pep8,py312

[testenv]
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
install_command = pip install --upgrade {packages}
commands = pytest -vv
whitelist_externals = sh
setenv =
    PYTHONPATH = {toxinidir}

[testenv:pep8]
commands = flake8 --ignore=E501 --show-source dci_kafka tests

[testenv:py312]
download = true
commands =
    {[testenv]commands}
