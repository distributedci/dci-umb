[tox]
skipsdist = True
envlist = pep8,py3

[testenv]
deps = -r{toxinidir}/requirements.txt
       -r{toxinidir}/test-requirements.txt
install_command = pip install --upgrade {packages}
commands = pytest -vv
whitelist_externals = sh
setenv =
    PYTHONPATH = {toxinidir}:dci_umb

[testenv:pep8]
commands = flake8 --ignore=E501 --show-source dci_umb tests

[testenv:py3]
commands =
    {[testenv]commands}
